name: Build OpenChamber image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build.yml
  schedule:
    - cron: '21 4 * * *'

permissions:
  contents: read
  packages: write

concurrency:
  group: openchamber-image-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest stable upstream release
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(gh api repos/openchamber/openchamber/releases/latest --jq '.tag_name')"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected upstream release tag: $TAG" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openchamber" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if release image already exists
        id: check
        shell: bash
        run: |
          if docker buildx imagetools inspect "${{ steps.upstream.outputs.image }}:${{ steps.upstream.outputs.tag }}" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo 'This version was already published; build skipped.'
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout official OpenChamber release
        if: steps.check.outputs.exists != 'true'
        uses: actions/checkout@v4
        with:
          repository: openchamber/openchamber
          ref: ${{ steps.upstream.outputs.tag }}
          path: upstream
          persist-credentials: false

      - name: Build and publish stable image
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.upstream.outputs.image }}:${{ steps.upstream.outputs.tag }}
            ${{ steps.upstream.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.upstream.outputs.tag }}
            org.opencontainers.image.description=OpenChamber official source release built for amd64
          cache-from: type=gha
          cache-to: type=gha,mode=min
